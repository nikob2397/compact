<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini App Compact</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            /* 100vh здесь — это высота КОНТЕЙНЕРА, который Telegram выделил */
            /* Если Telegram открыл в compact mode — это будет половина экрана */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #e0e0e0);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drag-handle {
            width: 36px;
            height: 4px;
            background: var(--tg-theme-hint-color, #999);
            border-radius: 2px;
            margin: 8px auto;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .expand-btn {
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
        }

        .info {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .mode-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
    </style>
</head>
<body>
    <!-- Индикатор того, что это draggable bottom sheet (compact mode) -->
    <div class="drag-handle"></div>

    <div class="header">
        <span class="mode-badge" id="modeBadge">COMPACT</span>
        <span style="font-weight: 600;">Моё Mini App</span>
    </div>

    <div class="content">
        <div class="info">
            <strong>Сейчас:</strong> <span id="viewportHeight">—</span><br>
            <strong>Режим:</strong> <span id="currentMode">Compact</span><br>
            <small>В compact mode приложение занимает нижнюю часть экрана. 
            Пользователь может потянуть вверх для expand.</small>
        </div>

        <p>Это содержимое compact mode. Оно адаптируется к высоте, которую выделил Telegram.</p>

        <button class="expand-btn" onclick="expandApp()">🔼 Развернуть на весь экран</button>
        <button class="expand-btn" onclick="requestFullscreen()" style="margin-top: 8px; background: #28a745;">
            ⛶ Полный экран (Fullscreen)
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        // Инициализация
        tg.ready();
        tg.expand(); // Это НЕ выходит из compact mode, а просто сообщает Telegram что готовы

        // Показываем BackButton если нужно
        tg.BackButton.show();

        // Обновляем инфо о viewport
        function updateInfo() {
            document.getElementById('viewportHeight').textContent = window.innerHeight + 'px';
            document.getElementById('currentMode').textContent = 
                tg.isExpanded ? 'Expanded' : (document.fullscreenElement ? 'Fullscreen' : 'Compact');
        }

        // Переключение в expanded mode (пользователь тянет или кнопка)
        function expandApp() {
            // Важно: expand() не выходит из compact mode полностью,
            // а разворачивает bottom sheet на максимальную высоту
            tg.expand();
        }

        // Полноэкранный режим (только если поддерживается)
        function requestFullscreen() {
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            } else {
                alert('Fullscreen не поддерживается в этой версии');
            }
        }

        // Слушаем изменение viewport
        tg.onEvent('viewportChanged', updateInfo);
        window.addEventListener('resize', updateInfo);

        // Обновляем при загрузке
        updateInfo();

        // Показываем MainButton для действия
        tg.MainButton.setText('Готово');
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            tg.close();
        });
    </script>
</body>
</html>
