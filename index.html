<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 16px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #ddd);
        }

        .content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .info {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-family: monospace;
            font-size: 13px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #e5e5e5);
            color: var(--tg-theme-text-color, #000);
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Mini App</h2>
    </div>

    <div class="content">
        <div class="info" id="info">
            Загрузка...
        </div>

        <p>Если открылось через inline кнопку — может быть компактно.</p>
        <p>Если через Menu Button — сразу полный экран.</p>

        <!-- Разворачиваем ТОЛЬКО если сейчас компактно -->
        <button class="btn" id="expandBtn" onclick="expand()" style="display:none;">
            🔼 Развернуть
        </button>

        <button class="btn btn-secondary" onclick="tg.close()">
            ❌ Закрыть
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();

        // Инфо о состоянии
        function updateInfo() {
            const info = document.getElementById('info');
            info.innerHTML = `
                viewportHeight: ${tg.viewportHeight}<br>
                viewportStableHeight: ${tg.viewportStableHeight}<br>
                isExpanded: ${tg.isExpanded}<br>
                platform: ${tg.platform}
            `;

            // Показываем кнопку expand только если НЕ развёрнуто
            const expandBtn = document.getElementById('expandBtn');
            if (!tg.isExpanded) {
                expandBtn.style.display = 'block';
            }
        }

        function expand() {
            tg.expand(); // Работает только если сейчас компактно
            updateInfo();
        }

        tg.onEvent('viewportChanged', updateInfo);
        updateInfo();

        tg.MainButton.setText('Готово');
        tg.MainButton.show();
        tg.MainButton.onClick(() => tg.close());
    </script>
</body>
</html>
